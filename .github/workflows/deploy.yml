# The website is built and hosted by Vercel on every push to main.
# This workflow double-checks the content and, once Vercel has published,
# tells search engines (Bing, Yandex and others via IndexNow) about the changes.
name: Check content and notify search engines

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Check content
        run: npm run check
      - name: Test build
        run: npm run build

  notify-search-engines:
    needs: check
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Wait for Vercel to publish, then ping IndexNow
        run: sleep 180 && node scripts/indexnow.mjs
